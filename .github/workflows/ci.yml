name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    # The backend suite talks to a real PostgreSQL rather than a mock, because the things worth
    # testing here are transactions, constraints and generated defaults.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coopmanage
          POSTGRES_PASSWORD: coopmanage
          POSTGRES_DB: coopmanage
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U coopmanage -d coopmanage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://coopmanage:coopmanage@localhost:5435/coopmanage?schema=public
      DIRECT_URL: postgresql://coopmanage:coopmanage@localhost:5435/coopmanage?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` generates the Prisma client through the backend's postinstall script. Prisma 7
      # no longer does it on install by itself, and without it `@prisma/client` is a stub with no
      # `Prisma` namespace — which is how the first run of this workflow failed at the seed.
      - run: npm ci

      - name: Build the shared package
        run: npm run build -w @coopmanage/shared

      - name: Apply migrations to an empty database
        run: npm run db:deploy

      - name: Seed reference data
        run: npm run db:seed

      - name: Seed again to prove it is idempotent
        run: npm run db:seed

      # A second, throwaway database: migrated from nothing, compared against schema.prisma and
      # seeded, then dropped. The step above proves the migrations apply; this one proves they
      # build the schema the code was written against, which is what a first deployment relies on.
      - name: Verify the migrations from an empty database
        run: npm run check:migrations

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

      # Its own step, ahead of the suite, because this is the one failure whose cause should be
      # readable without opening a test report: a key added in English and not in Kinyarwanda, a
      # placeholder renamed in one language, a string left as a copy of the English, or a count
      # without a singular form. The frontend suite runs the same checks; this names them.
      - name: Check the translations
        run: npm run check:translations

      # An S3-compatible store for the storage driver's tests, which run against a real endpoint
      # or not at all. `quay.io/minio/minio` needs its `server` argument, which a service
      # container cannot be given, so it is started here.
      - name: Start an object store
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            quay.io/minio/minio:latest server /data
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:9100/minio/health/live && break; sleep 1; done

      # A mail server that requires credentials, for the SMTP driver's tests.
      - name: Start a mail catcher
        run: |
          docker run -d --name mailpit -p 1025:1025 -p 8025:8025 \
            -e MP_SMTP_AUTH=user:pass -e MP_SMTP_AUTH_ALLOW_INSECURE=1 axllent/mailpit:latest
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8025/api/v1/info && break; sleep 1; done

      - run: npm run test
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:9100
          SMTP_TEST_URL: smtp://user:pass@127.0.0.1:1025
      - run: npm run build

  rehearsal:
    name: Deployment rehearsal
    runs-on: ubuntu-latest
    needs: quality

    # The production image, a production environment and an empty database: Phase 18's exit
    # criterion, run on every push so the first real deployment is never the first time.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coopmanage
          POSTGRES_PASSWORD: coopmanage
          POSTGRES_DB: coopmanage
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U coopmanage -d coopmanage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://coopmanage:coopmanage@localhost:5435/coopmanage?schema=public

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run deploy:rehearse

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # High and critical findings fail the build, except the two reached only through the Prisma
      # CLI — which the gate accepts by name, with a written reason and a review date, and which it
      # will fail on the day they stop being reported so the exception is deleted rather than left
      # covering an advisory nobody has looked at. docs/security.md §11 carries the same reasons.
      - name: Dependency gate
        run: npm run check:audit
      - name: Report development-only advisories without failing
        run: npm audit --audit-level=high || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
