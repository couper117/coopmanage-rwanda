name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    # The backend suite talks to a real PostgreSQL rather than a mock, because the things worth
    # testing here are transactions, constraints and generated defaults.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: coopmanage
          POSTGRES_PASSWORD: coopmanage
          POSTGRES_DB: coopmanage
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U coopmanage -d coopmanage"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://coopmanage:coopmanage@localhost:5435/coopmanage?schema=public
      DIRECT_URL: postgresql://coopmanage:coopmanage@localhost:5435/coopmanage?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Build the shared package
        run: npm run build -w @coopmanage/shared

      - name: Apply migrations to an empty database
        run: npm run db:deploy

      - name: Seed reference data
        run: npm run db:seed

      - name: Seed again to prove it is idempotent
        run: npm run db:seed

      # A second, throwaway database: migrated from nothing, compared against schema.prisma and
      # seeded, then dropped. The step above proves the migrations apply; this one proves they
      # build the schema the code was written against, which is what a first deployment relies on.
      - name: Verify the migrations from an empty database
        run: npm run check:migrations

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

      # Its own step, ahead of the suite, because this is the one failure whose cause should be
      # readable without opening a test report: a key added in English and not in Kinyarwanda, a
      # placeholder renamed in one language, a string left as a copy of the English, or a count
      # without a singular form. The frontend suite runs the same checks; this names them.
      - name: Check the translations
        run: npm run check:translations

      - run: npm run test
      - run: npm run build

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # High and critical findings fail the build, except the two reached only through the Prisma
      # CLI — which the gate accepts by name, with a written reason and a review date, and which it
      # will fail on the day they stop being reported so the exception is deleted rather than left
      # covering an advisory nobody has looked at. docs/security.md §11 carries the same reasons.
      - name: Dependency gate
        run: npm run check:audit
      - name: Report development-only advisories without failing
        run: npm audit --audit-level=high || true

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
